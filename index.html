<!doctype html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>LOCASH IMOBILIÁRIA | Gestão & Central de Locações</title>
    
    <!-- PWA & Standalone Mobile Web App Meta Tags (FutPlay Method) -->
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#080d1a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="LOCASH" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <meta name="description" content="LOCASH — Plataforma Imobiliária Futurista com Mapa Interativo 3D e Central de Gestão de Locações" />

    <!-- Google Fonts: Inter & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet">

    <!-- MapLibre GL 3D CSS -->
    <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
  </head>
  <body class="bg-cyber-darkest text-cyber-text antialiased selection:bg-cyber-cyan selection:text-black overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Service Worker Registration (FutPlay Method) -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          const swUrl = new URL('sw.js', window.location.href).pathname;
          navigator.serviceWorker.register(swUrl)
            .then(reg => console.log('PWA ServiceWorker registrado:', reg.scope))
            .catch(() => {
              navigator.serviceWorker.register('./sw.js')
                .then(reg => console.log('PWA ServiceWorker registrado (fallback):', reg.scope))
                .catch(err => console.warn('PWA ServiceWorker falhou:', err));
            });
        });
      }
    </script>
  </body>
</html>
